---
extends: default

rules:
  # Allow longer lines — YAML config values can be verbose
  line-length:
    max: 120
    level: warning

  # Compose files use truthy values like "false" as strings — allow them
  truthy:
    allowed-values: ["true", "false", "yes", "no", "on", "off"]
    check-keys: false

  # Multi-document YAML not used here
  document-start: disable
