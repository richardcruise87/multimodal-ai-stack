[project]
name = "multimodal-ai-stack"
version = "0.1.0"
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "yamllint>=1.30",
]

# =============================================================================
# Ruff — linter + formatter
# =============================================================================
[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B006",   # mutable default args — not present here, but safe to ignore
    "UP007",  # X | Y union syntax — keep compat with Python 3.8
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # assert statements expected in tests
]

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
